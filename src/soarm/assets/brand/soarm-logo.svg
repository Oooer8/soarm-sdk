<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="220" viewBox="0 0 720 220" role="img" aria-labelledby="title desc">
  <title id="title">SOARM SDK logo</title>
  <desc id="desc">Theme-aware SOARM SDK wordmark with a robotic arm mark.</desc>
  <style>
    :root {
      color-scheme: light dark;
      --tile: #eef7f6;
      --tile-edge: #cce4e0;
      --accent: #0c7a75;
      --accent-strong: #095d59;
      --ink: #172033;
      --muted: #5e6b80;
      --joint: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --tile: #102625;
        --tile-edge: #265854;
        --accent: #58d7cb;
        --accent-strong: #7ee5dc;
        --ink: #eef8f7;
        --muted: #aab6c6;
        --joint: #101417;
      }
    }
  </style>
  <g transform="translate(24 24)">
    <rect width="172" height="172" rx="38" fill="var(--tile)" stroke="var(--tile-edge)" stroke-width="4"/>
    <path d="M35 115h34l18-42 28 18 15-35" fill="none" stroke="var(--accent)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="35" cy="115" r="14" fill="var(--joint)" stroke="var(--accent-strong)" stroke-width="6"/>
    <circle cx="87" cy="73" r="14" fill="var(--joint)" stroke="var(--accent-strong)" stroke-width="6"/>
    <circle cx="130" cy="56" r="14" fill="var(--joint)" stroke="var(--accent-strong)" stroke-width="6"/>
    <path d="M24 137h68" fill="none" stroke="var(--ink)" stroke-width="10" stroke-linecap="round"/>
    <text x="86" y="50" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" font-weight="850" fill="var(--ink)" letter-spacing="0">SO</text>
  </g>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" letter-spacing="0">
    <text x="230" y="95" font-size="62" font-weight="850" fill="var(--ink)">SOARM SDK</text>
    <text x="234" y="139" font-size="24" font-weight="650" fill="var(--muted)">Python SDK and local web console</text>
    <path d="M236 163h218" fill="none" stroke="var(--accent)" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
