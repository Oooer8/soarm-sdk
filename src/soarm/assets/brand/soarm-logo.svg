<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" role="img" aria-labelledby="title desc">
  <title id="title">SOARM SDK logo</title>
  <desc id="desc">SOARM SDK wordmark beside a stylized robotic arm mark.</desc>
  <defs>
    <style>
      :root {
        --wordmark: #101820;
        --submark: #5e6875;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --wordmark: #f4f8fb;
          --submark: #aab4c2;
        }
      }
    </style>
    <linearGradient id="plate" x1="54" x2="190" y1="42" y2="178" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#172231" />
      <stop offset="1" stop-color="#0d121a" />
    </linearGradient>
    <linearGradient id="arm" x1="64" x2="184" y1="157" y2="81" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2f8cff" />
      <stop offset="0.56" stop-color="#63c6ff" />
      <stop offset="1" stop-color="#2bd98f" />
    </linearGradient>
    <linearGradient id="arc" x1="62" x2="198" y1="75" y2="152" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2f8cff" />
      <stop offset="1" stop-color="#32d583" />
    </linearGradient>
    <linearGradient id="sdkBadge" x1="418" x2="508" y1="132" y2="132" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2388ff" />
      <stop offset="1" stop-color="#21c281" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" flood-color="#000000" flood-opacity="0.22" stdDeviation="14" />
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" result="blur" stdDeviation="2.4" />
      <feColorMatrix in="blur" result="glow" type="matrix" values="0 0 0 0 0.12 0 0 0 0 0.58 0 0 0 0 1 0 0 0 0.52 0" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <g>
    <rect x="30" y="24" width="172" height="172" rx="40" fill="url(#plate)" filter="url(#shadow)" />
    <path d="M65 75c24-30 72-36 104-13 26 19 38 51 28 80" fill="none" stroke="url(#arc)" stroke-linecap="round" stroke-width="6" opacity="0.78" />
    <path d="M198 142l-13-2 10-11" fill="none" stroke="#32d583" stroke-linecap="round" stroke-linejoin="round" stroke-width="6" opacity="0.78" />
    <path d="M61 153h48c11 0 19-7 22-18l7-34 28 19" fill="none" stroke="url(#arm)" stroke-linecap="round" stroke-linejoin="round" stroke-width="15" filter="url(#glow)" />
    <path d="M166 120l18-11" fill="none" stroke="#edf6ff" stroke-linecap="round" stroke-width="11" />
    <path d="M184 109l16-13M184 109l18 8" fill="none" stroke="#edf6ff" stroke-linecap="round" stroke-width="7" />
    <rect x="55" y="144" width="61" height="20" rx="10" fill="#edf6ff" />
    <rect x="65" y="151" width="40" height="6" rx="3" fill="#172231" opacity="0.72" />
    <circle cx="109" cy="154" r="15" fill="#111923" stroke="#edf6ff" stroke-width="6" />
    <circle cx="131" cy="135" r="15" fill="#111923" stroke="#63c6ff" stroke-width="6" />
    <circle cx="138" cy="101" r="14" fill="#111923" stroke="#edf6ff" stroke-width="6" />
    <circle cx="166" cy="120" r="13" fill="#111923" stroke="#32d583" stroke-width="6" />
    <circle cx="109" cy="154" r="4" fill="#32d583" />
    <circle cx="138" cy="101" r="4" fill="#2f8cff" />
    <circle cx="166" cy="120" r="3.5" fill="#edf6ff" />
  </g>
  <g>
    <text x="232" y="108" fill="var(--wordmark)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="64" font-weight="850" letter-spacing="0">SOARM</text>
    <rect x="418" y="122" width="93" height="35" rx="17.5" fill="url(#sdkBadge)" />
    <text x="442" y="146" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="850" letter-spacing="0">SDK</text>
    <text x="233" y="150" fill="var(--submark)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="700" letter-spacing="0">Python control kit for robotic arms</text>
  </g>
</svg>
