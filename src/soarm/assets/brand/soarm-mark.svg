<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">SOARM SDK mark</title>
  <desc id="desc">A stylized robotic arm with joint nodes and a motion arc.</desc>
  <defs>
    <linearGradient id="plate" x1="42" x2="214" y1="32" y2="224" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#172231" />
      <stop offset="1" stop-color="#0d121a" />
    </linearGradient>
    <linearGradient id="arm" x1="55" x2="207" y1="178" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2f8cff" />
      <stop offset="0.56" stop-color="#63c6ff" />
      <stop offset="1" stop-color="#2bd98f" />
    </linearGradient>
    <linearGradient id="arc" x1="52" x2="220" y1="67" y2="164" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2f8cff" />
      <stop offset="1" stop-color="#32d583" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" flood-color="#000000" flood-opacity="0.25" stdDeviation="18" />
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" result="blur" stdDeviation="3" />
      <feColorMatrix in="blur" result="glow" type="matrix" values="0 0 0 0 0.12 0 0 0 0 0.58 0 0 0 0 1 0 0 0 0.55 0" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect x="18" y="18" width="220" height="220" rx="50" fill="url(#plate)" filter="url(#shadow)" />
  <path d="M63 83c31-38 91-46 132-16 32 23 46 64 34 101" fill="none" stroke="url(#arc)" stroke-linecap="round" stroke-width="7" opacity="0.78" />
  <path d="M229 168l-17-3 12-13" fill="none" stroke="#32d583" stroke-linecap="round" stroke-linejoin="round" stroke-width="7" opacity="0.78" />
  <path d="M58 181h61c13 0 24-9 27-22l9-43 35 24" fill="none" stroke="url(#arm)" stroke-linecap="round" stroke-linejoin="round" stroke-width="18" filter="url(#glow)" />
  <path d="M190 140l23-14" fill="none" stroke="#edf6ff" stroke-linecap="round" stroke-width="13" />
  <path d="M213 126l20-17M213 126l23 10" fill="none" stroke="#edf6ff" stroke-linecap="round" stroke-width="8" />
  <rect x="51" y="170" width="76" height="24" rx="12" fill="#edf6ff" />
  <rect x="64" y="178" width="50" height="8" rx="4" fill="#172231" opacity="0.72" />
  <circle cx="119" cy="181" r="19" fill="#111923" stroke="#edf6ff" stroke-width="7" />
  <circle cx="146" cy="159" r="18" fill="#111923" stroke="#63c6ff" stroke-width="7" />
  <circle cx="155" cy="116" r="17" fill="#111923" stroke="#edf6ff" stroke-width="7" />
  <circle cx="190" cy="140" r="15" fill="#111923" stroke="#32d583" stroke-width="7" />
  <circle cx="119" cy="181" r="5" fill="#32d583" />
  <circle cx="155" cy="116" r="5" fill="#2f8cff" />
  <circle cx="190" cy="140" r="4" fill="#edf6ff" />
</svg>
