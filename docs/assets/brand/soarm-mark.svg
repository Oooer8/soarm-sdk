<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">SOARM SDK mark</title>
  <desc id="desc">A theme-aware SOARM robotic arm mark.</desc>
  <style>
    :root {
      color-scheme: light dark;
      --tile: #eef7f6;
      --tile-edge: #cce4e0;
      --accent: #0c7a75;
      --accent-strong: #095d59;
      --ink: #172033;
      --joint: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --tile: #102625;
        --tile-edge: #265854;
        --accent: #58d7cb;
        --accent-strong: #7ee5dc;
        --ink: #eef8f7;
        --joint: #101417;
      }
    }
  </style>
  <rect x="18" y="18" width="220" height="220" rx="46" fill="var(--tile)" stroke="var(--tile-edge)" stroke-width="4"/>
  <path d="M64 170h48l24-58 38 24 20-48" fill="none" stroke="var(--accent)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="64" cy="170" r="18" fill="var(--joint)" stroke="var(--accent-strong)" stroke-width="8"/>
  <circle cx="136" cy="112" r="18" fill="var(--joint)" stroke="var(--accent-strong)" stroke-width="8"/>
  <circle cx="194" cy="88" r="18" fill="var(--joint)" stroke="var(--accent-strong)" stroke-width="8"/>
  <path d="M49 197h86" fill="none" stroke="var(--ink)" stroke-width="12" stroke-linecap="round"/>
  <text x="128" y="74" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="38" font-weight="850" fill="var(--ink)" letter-spacing="0">SO</text>
</svg>
