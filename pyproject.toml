[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soarm"
version = "0.1.0"
description = "Python SDK for controlling the SOARM robotic arm."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "SOARM Contributors" }
]
dependencies = [
  "PyYAML>=6.0",
  "ftservo-python-sdk>=2.0.0"
]

[project.scripts]
soarm = "soarm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
soarm = [
  "webapp/*",
  "webapp/vendor/*",
  "assets/soarm/urdf/*",
  "assets/soarm101/urdf/*",
  "assets/soarm101/urdf/assets/*",
]
